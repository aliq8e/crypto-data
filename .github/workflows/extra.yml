name: extra-data
on:
  schedule:
    - cron: '23 22 * * *'
    - cron: '23 6 * * *'
    - cron: '53 11 * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/extra.yml']
permissions:
  contents: write
concurrency: extra-data
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch macro, funding, sentiment, stablecoins
        run: |
          python3 - <<'EOF'
          import json, csv, os, io, zipfile, time, urllib.request, urllib.parse, urllib.error, datetime as dt
          UA = {"User-Agent": "Mozilla/5.0 (crypto-data)"}
          NOW = dt.datetime.now(dt.timezone.utc)
          TODAY = NOW.date()
          ST = {"updated_utc": NOW.isoformat(timespec="seconds"), "items": {}}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as f:
                  return f.read()

          def save(path, cols, rows, key):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              old = {}
              if os.path.exists(path):
                  with open(path) as f: old = {r[key]: r for r in csv.DictReader(f)}
              for r in rows: old[r[key]] = r
              out = [old[k] for k in sorted(old)]
              with open(path, "w", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=cols); w.writeheader(); w.writerows(out)
              return out

          def note(name, out, key="date", err=None):
              ST["items"][name] = {"rows": len(out), "last": out[-1][key] if out else None, "error": err}

          def run(name, fn):
              try: fn()
              except Exception as e: ST["items"][name] = {"rows": 0, "last": None, "error": str(e)[:200]}

          def n(x): return "" if x is None else str(round(float(x), 6))

          # 1) FRED (official US data; usually 1 business day late, exchange rates up to a week)
          FRED = ["DGS10", "GS10", "VIXCLS", "DCOILBRENTEU", "DCOILWTICO", "SP500", "NASDAQCOM", "DTWEXBGS",
                  "DEXUSEU", "DEXJPUS", "DEXUSUK", "DEXCAUS", "DEXSDUS", "DEXSZUS"]
          def fred(sid):
              txt = get(f"https://fred.stlouisfed.org/graph/fredgraph.csv?id={sid}").decode()
              rows = [{"date": r[0], "value": r[1]} for r in csv.reader(io.StringIO(txt))
                      if len(r) >= 2 and r[0][:4].isdigit() and r[1] not in ("", ".")]
              note(f"fred_{sid}", save(f"data/macro/fred_{sid}.csv", ["date", "value"], rows, "date"))
          for sid in FRED:
              run(f"fred_{sid}", lambda sid=sid: fred(sid))

          def dxy_from_fred():
              ids = ["DEXUSEU", "DEXJPUS", "DEXUSUK", "DEXCAUS", "DEXSDUS", "DEXSZUS"]
              ser = {}
              for sid in ids:
                  with open(f"data/macro/fred_{sid}.csv") as f:
                      ser[sid] = {r["date"]: float(r["value"]) for r in csv.DictReader(f)}
              rows = []
              for d in sorted(set.intersection(*[set(v) for v in ser.values()])):
                  e, j, g, c, s, ch = [ser[k][d] for k in ids]
                  v = 50.14348112 * e**-0.576 * j**0.136 * g**-0.119 * c**0.091 * s**0.042 * ch**0.036
                  rows.append({"date": d, "value": f"{v:.4f}"})
              note("dxy_from_fred", save("data/macro/dxy_from_fred.csv", ["date", "value"], rows, "date"))
          run("dxy_from_fred", dxy_from_fred)

          # 2) Yahoo daily bars (fresher; today's bar kept only after 22:00 UTC)
          YAHOO = {"DXY": "DX-Y.NYB", "VIX": "^VIX", "US10Y": "^TNX", "BRENT": "BZ=F", "WTI": "CL=F",
                   "GOLD": "GC=F", "SP500": "^GSPC", "NASDAQ": "^IXIC"}
          def yahoo(name, sym):
              j = json.loads(get(f"https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(sym)}?range=10y&interval=1d"))
              res = j["chart"]["result"][0]; q = res["indicators"]["quote"][0]
              rows = []
              for i, t in enumerate(res["timestamp"]):
                  if q["close"][i] is None: continue
                  d = dt.datetime.fromtimestamp(t, dt.timezone.utc).date()
                  if d > TODAY or (d == TODAY and NOW.hour < 22): continue
                  rows.append({"date": d.isoformat(), "open": n(q["open"][i]), "high": n(q["high"][i]),
                               "low": n(q["low"][i]), "close": n(q["close"][i])})
              note(f"yahoo_{name}", save(f"data/macro/yahoo_{name}.csv", ["date", "open", "high", "low", "close"], rows, "date"))
          for name, sym in YAHOO.items():
              run(f"yahoo_{name}", lambda name=name, sym=sym: yahoo(name, sym))
              time.sleep(1)

          # 3) Binance USDT-M funding rates: official monthly archive + API for recent rows
          PERPS = ["BTC", "ETH", "SOL", "BNB", "LINK", "AVAX", "LTC", "BCH", "UNI", "NEAR"]
          def tm(ms):
              ms = int(ms)
              if ms > 10**14: ms //= 1000
              return dt.datetime.fromtimestamp(ms / 1000, dt.timezone.utc).strftime("%Y-%m-%d %H:%M")
          def funding(s):
              path = f"data/funding/{s}USDT_funding.csv"
              have = []
              if os.path.exists(path):
                  with open(path) as f: have = list(csv.DictReader(f))
              arch = [r["time_utc"] for r in have if r["source"] == "binance_archive"]
              m = dt.date.fromisoformat(arch[-1][:7] + "-01") if arch else dt.date(2019, 9, 1)
              last_full = (TODAY.replace(day=1) - dt.timedelta(1)).replace(day=1)
              rows, errs = [], []
              while m <= last_full:
                  try:
                      z = zipfile.ZipFile(io.BytesIO(get(f"https://data.binance.vision/data/futures/um/monthly/fundingRate/{s}USDT/{s}USDT-fundingRate-{m:%Y-%m}.zip")))
                      for k in csv.reader(io.StringIO(z.read(z.namelist()[0]).decode())):
                          if k and k[0].isdigit():
                              rows.append({"time_utc": tm(k[0]), "rate": n(k[-1]), "interval_h": k[1] if len(k) >= 3 else "", "source": "binance_archive"})
                  except urllib.error.HTTPError as e:
                      if e.code != 404: errs.append(f"{m:%Y-%m}: {e}")
                  except Exception as e:
                      errs.append(f"{m:%Y-%m}: {e}")
                  m = (m + dt.timedelta(32)).replace(day=1)
              try:
                  start = int(dt.datetime.combine(last_full, dt.time(), dt.timezone.utc).timestamp() * 1000)
                  for x in json.loads(get(f"https://fapi.binance.com/fapi/v1/fundingRate?symbol={s}USDT&startTime={start}&limit=1000")):
                      rows.append({"time_utc": tm(x["fundingTime"]), "rate": n(x["fundingRate"]), "interval_h": "", "source": "binance_api"})
              except Exception as e:
                  errs.append(f"api: {e}")
              merged = {r["time_utc"]: r for r in have}
              for r in rows:
                  if r["source"] == "binance_archive" or r["time_utc"] not in merged: merged[r["time_utc"]] = r
              out = save(path, ["time_utc", "rate", "interval_h", "source"], list(merged.values()), "time_utc")
              note(f"funding_{s}", out, "time_utc", "; ".join(errs[-3:]) or None)
          for s in PERPS:
              run(f"funding_{s}", lambda s=s: funding(s))

          # 4) Crypto Fear & Greed index (alternative.me)
          def fng():
              j = json.loads(get("https://api.alternative.me/fng/?limit=0&format=json"))
              rows = [{"date": dt.datetime.fromtimestamp(int(x["timestamp"]), dt.timezone.utc).strftime("%Y-%m-%d"),
                       "value": x["value"], "class": x["value_classification"]} for x in j["data"]]
              note("fear_greed", save("data/sentiment/fear_greed.csv", ["date", "value", "class"], rows, "date"))
          run("fear_greed", fng)

          # 5) Total stablecoin supply in USD (DefiLlama)
          def stables():
              j = json.loads(get("https://stablecoins.llama.fi/stablecoincharts/all"))
              rows = [{"date": dt.datetime.fromtimestamp(int(x["date"]), dt.timezone.utc).strftime("%Y-%m-%d"),
                       "total_usd": f'{sum(x["totalCirculatingUSD"].values()):.0f}'} for x in j if x.get("totalCirculatingUSD")]
              note("stablecoins_total", save("data/onchain/stablecoins_total.csv", ["date", "total_usd"], rows, "date"))
          run("stablecoins_total", stables)

          with open("data/_status_extra.json", "w") as f: json.dump(ST, f, indent=1)
          for k, v in ST["items"].items(): print(k, v)
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "extra data $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
